name: FW Kitchen (build)

on:
  workflow_dispatch:
  push:
    paths:
      - 'kitchen/**'
      - '.github/workflows/kitchen.yml'

jobs:
  test-and-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitchen
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config e2fsprogs liblz4-dev autoconf automake libtool && pip install lz4
      - name: erofs-utils oficial (host) para probar el camino de Android
        run: |
          git clone -q --depth 1 --branch v1.9.4 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs
          cd /tmp/erofs && ./autogen.sh >/dev/null && ./configure -q --disable-fuse --disable-lzma --without-uuid --without-zlib \
            --without-libzstd --without-libcurl --without-openssl --without-libxml2 --without-json-c && make -s -j"$(nproc)"
          mkdir -p /tmp/upstream && cp mkfs/mkfs.erofs fsck/fsck.erofs /tmp/upstream/
          echo "FWK_UPSTREAM_EROFS=/tmp/upstream" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - name: Pruebas (motor + flujo completo)
        run: chmod +x ../tools/android-tools/* ../tools/erofs-utils/* && flutter test
      - run: flutter build linux --release
      - name: Empaquetar
        run: tar -C build/linux/x64/release -czf fw_kitchen-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: fw_kitchen-linux-x64
          path: kitchen/fw_kitchen-linux-x64.tar.gz

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kitchen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Herramientas ARM64 (erofs-utils + lz4) con el NDK
        run: |
          sudo apt-get install -y autoconf automake libtool
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          tool/build_android_tools.sh "$ANDROID_SDK_ROOT/ndk/28.2.13676358" arm64-v8a
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: fw_kitchen-android-arm64
          path: kitchen/build/app/outputs/flutter-apk/app-release.apk
